name: Build All

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Mondays at 6 AM UTC
  workflow_dispatch:
  workflow_call:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86
            # Explicit label, not windows-latest: the build needs the
            # v142 toolset component (see README), which is only
            # guaranteed to be present on the explicitly-labelled
            # images. Don't bump past windows-2025 without confirming
            # the v142 component is still installed on the new image.
            runs-on: windows-2025
            artifact-path: MagPython-windows-x86.zip
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            artifact-path: MagPython-linux-x86_64.zip
          - platform: macos-arm64
            runs-on: macos-14
            artifact-path: MagPython-macos-arm64.zip
    steps:
      - uses: actions/checkout@v6

      # Windows build (existing logic, unchanged behaviour)
      - if: matrix.platform == 'windows-x86'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - if: matrix.platform == 'windows-x86'
        run: '& msbuild /m /p:Configuration=Release MagPython\MagPython.metaproj'
      - if: matrix.platform == 'windows-x86'
        run: 'cd MagPython && ren Release MagPython && 7z a -r ..\MagPython-windows-x86.zip MagPython'

      # Linux build (manylinux_2_28 container)
      - if: matrix.platform == 'linux-x86_64'
        run: ./MagPython/build-linux.sh

      # macOS build
      - if: matrix.platform == 'macos-arm64'
        run: ./MagPython/build-macos.sh

      # Per-platform release-notes fragment. Each job knows its own toolchain
      # (MSVC toolset, manylinux container, macOS deployment target) and is
      # the only one that needs to look at platform-specific source files,
      # so the Release workflow can ship the resulting .md verbatim without
      # re-deriving anything.
      #
      # OpenSSL version comes from openssl/VERSION.dat (the source of truth
      # for OpenSSL 3.x — opensslv.h is generated by ./Configure and isn't
      # present in the source tree, which is what broke the previous
      # release-job grep on opensslv.h).
      - name: Generate build details
        shell: bash
        run: |
          set -euo pipefail

          PY_VERSION="$(awk '/^#define PY_VERSION[[:space:]]/ {gsub(/"/, "", $3); print $3; exit}' Python/Include/patchlevel.h)"
          OPENSSL_VERSION="$(awk -F= '
            /^MAJOR=/             {gsub(/[ \t\r]/, "", $2); maj=$2}
            /^MINOR=/             {gsub(/[ \t\r]/, "", $2); min=$2}
            /^PATCH=/             {gsub(/[ \t\r]/, "", $2); pat=$2}
            /^PRE_RELEASE_TAG=/   {gsub(/[ \t\r]/, "", $2); pre=$2}
            /^BUILD_METADATA=/    {gsub(/[ \t\r]/, "", $2); meta=$2}
            END {
              v = maj"."min"."pat
              if (pre  != "") v = v"-"pre
              if (meta != "") v = v"+"meta
              print v
            }
          ' openssl/VERSION.dat)"

          for var in PY_VERSION OPENSSL_VERSION; do
            [ -n "${!var}" ] || { echo "failed to detect $var" >&2; exit 1; }
          done

          out="MagPython-${{ matrix.platform }}.md"
          case "${{ matrix.platform }}" in
            windows-x86)
              MSVC_TOOLSET="$(sed -n -E 's|.*<PlatformToolset[^>]*>([^<]+)</PlatformToolset>.*|\1|p' MagPython/common.props | head -1)"
              [ -n "$MSVC_TOOLSET" ] || { echo "failed to detect MSVC_TOOLSET" >&2; exit 1; }
              cat > "$out" <<EOF
          ### Windows x86
          - Python ${PY_VERSION}
          - OpenSSL ${OPENSSL_VERSION}
          - MSVC Toolset ${MSVC_TOOLSET}
          EOF
              ;;
            linux-x86_64)
              MANYLINUX_TAG="$(printf '%s' '${{ matrix.container }}' | sed -n -E 's|.*quay\.io/pypa/(manylinux[^ ]+).*|\1|p')"
              [ -n "$MANYLINUX_TAG" ] || { echo "failed to detect MANYLINUX_TAG" >&2; exit 1; }
              cat > "$out" <<EOF
          ### Linux x86_64
          - Python ${PY_VERSION}
          - OpenSSL ${OPENSSL_VERSION}
          - ${MANYLINUX_TAG}
          EOF
              ;;
            macos-arm64)
              MACOS_DEPLOY_TARGET="$(sed -n -E 's|^export MACOSX_DEPLOYMENT_TARGET=([0-9.]+).*|\1|p' MagPython/build-macos.sh | head -1)"
              [ -n "$MACOS_DEPLOY_TARGET" ] || { echo "failed to detect MACOS_DEPLOY_TARGET" >&2; exit 1; }
              cat > "$out" <<EOF
          ### macOS arm64
          - Python ${PY_VERSION}
          - OpenSSL ${OPENSSL_VERSION}
          - ${{ matrix.runs-on }} runner, MACOSX_DEPLOYMENT_TARGET=${MACOS_DEPLOY_TARGET}
          EOF
              ;;
            *)
              echo "no build-details template for platform ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac

          cat "$out"

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: MagPython-${{ matrix.platform }}
          retention-days: 7
          path: |
            ${{ matrix.artifact-path }}
            MagPython-${{ matrix.platform }}.md
