name: Build All

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Mondays at 6 AM UTC
  workflow_dispatch:
  workflow_call:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    # Bumped from 30 to 120 to absorb the Qt6 + PySide6 source builds
    # on linux-x86_64 / macos-arm64 (~30-50 min combined on a fresh
    # cache). Windows isn't affected — Qt 6 dropped 32-bit Windows and
    # the windows-x86 path is unchanged from before this PR.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86
            # Explicit label, not windows-latest: the build needs the
            # v142 toolset component (see README), which is only
            # guaranteed to be present on the explicitly-labelled
            # images. As of 2026-05-12 GitHub redirects this label to
            # the windows-2025-vs2026 image (VS 2026 replacing VS 2022);
            # v142 is preserved on that image via the
            # Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64
            # component. Don't bump past windows-2025 without confirming
            # v142 is still present on the new image.
            runs-on: windows-2025
            msvc-arch: x86
            msbuild-platform: Win32
          - platform: windows-x64
            # Same image as windows-x86 for the same reason — v142 is
            # only guaranteed on explicitly-labelled Windows images.
            # The x86.x64 component group covers both host targets, so
            # the 64-bit cross/native tools land on this image too.
            runs-on: windows-2025
            msvc-arch: x64
            msbuild-platform: x64
          - platform: linux-x86_64
            runs-on: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - platform: macos-arm64
            runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      # Pin the host Python to 3.13 on macos-arm64. Our libMagPython is
      # built against the CPython 3.13.13 source tree (MagPython/python-version),
      # and build-macos.sh uses the host python3 as PYTHON_FOR_REGEN /
      # for `pip install cmake ninja`. macos-14's default python3 has been
      # 3.14 for a while, so we pin it back to 3.13.
      #
      # Linux uses the manylinux container's /opt/python/cp313-cp313
      # directly. windows-x64 no longer needs a pinned host Python at all:
      # MagPythonExe.vcxproj builds our own python3.exe linked against
      # MagPython.lib, and the PySide6 build invokes that directly (see
      # build-pyside6-windows.sh).
      - if: matrix.platform == 'macos-arm64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Cache the build-time-downloaded source trees so subsequent CI
      # runs skip the download + extract when the version+SHA pins
      # haven't changed. Cache miss only on a version bump (or on the
      # first run after a cache was added). One step per devendored
      # dep so a bump in one doesn't invalidate the others.
      # actions/cache@v4 scopes the cache key by OS implicitly, so
      # per-platform tarball extraction state stays isolated.
      - name: Cache OpenSSL download
        uses: actions/cache@v5
        with:
          path: MagPython/openssl
          key: deps-openssl-${{ matrix.platform }}-${{ hashFiles('MagPython/openssl-version', 'MagPython/openssl-sha256') }}
      - name: Cache libmpdec download
        uses: actions/cache@v5
        with:
          path: MagPython/libmpdec
          key: deps-libmpdec-${{ matrix.platform }}-${{ hashFiles('MagPython/libmpdec-version', 'MagPython/libmpdec-sha256') }}
      - name: Cache zlib download
        uses: actions/cache@v5
        with:
          path: MagPython/zlib
          key: deps-zlib-${{ matrix.platform }}-${{ hashFiles('MagPython/zlib-version', 'MagPython/zlib-sha256') }}
      - name: Cache libffi download
        uses: actions/cache@v5
        with:
          path: MagPython/libffi
          key: deps-libffi-${{ matrix.platform }}-${{ hashFiles('MagPython/libffi-version', 'MagPython/libffi-sha256') }}
      - name: Cache SQLite download
        uses: actions/cache@v5
        with:
          path: MagPython/sqlite
          key: deps-sqlite-${{ matrix.platform }}-${{ hashFiles('MagPython/sqlite-version', 'MagPython/sqlite-year', 'MagPython/sqlite-sha256') }}
      - name: Cache CPython download
        uses: actions/cache@v5
        with:
          path: MagPython/python
          key: deps-python-${{ matrix.platform }}-${{ hashFiles('MagPython/python-version', 'MagPython/python-sha256') }}
      # Qt6 / PySide6 caches only matter on linux-x86_64 and macos-arm64
      # — the windows-x86 build has no Qt/PySide6 step. Keying off the
      # pin files mirrors the other dep caches: a version bump
      # invalidates, a no-op push reuses.
      - name: Cache Qt6 download
        if: matrix.platform != 'windows-x86'
        uses: actions/cache@v5
        with:
          path: MagPython/qt6
          key: deps-qt6-${{ matrix.platform }}-${{ hashFiles('MagPython/qt6-version', 'MagPython/qt6-sha256') }}
      - name: Cache PySide6 download
        if: matrix.platform != 'windows-x86'
        uses: actions/cache@v5
        with:
          path: MagPython/pyside6
          key: deps-pyside6-${{ matrix.platform }}-${{ hashFiles('MagPython/pyside6-version', 'MagPython/pyside6-sha256') }}

      # Windows builds (shared between windows-x86 and windows-x64; the
      # MSBuild Platform and the MSVC tools arch come from the matrix).
      - if: startsWith(matrix.platform, 'windows-')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      # LibFFI.vcxproj runs upstream libffi's ./configure under MSVC
      # (msvcc.sh CC wrapper) to generate fficonfig.h + ffi.h; needs
      # bash + autotools. path-type: inherit keeps the MSVC env from
      # ilammy/msvc-dev-cmd visible to msvcc.sh inside the MSYS2 shell.
      - if: startsWith(matrix.platform, 'windows-')
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: base-devel autoconf automake libtool make
      - if: startsWith(matrix.platform, 'windows-')
        run: '& msbuild /m /p:Configuration=Release /p:Platform=${{ matrix.msbuild-platform }} MagPython\MagPython.metaproj'

      # windows-x64 only: build Qt6 + PySide6 from source against the
      # MagPython.dll the msbuild step just produced, and stage the
      # resulting DLLs + site-packages into MagPython\Release\ so the
      # subsequent rename+zip step picks them up. Skipped on
      # windows-x86 because Qt 6 dropped 32-bit Windows entirely.
      - name: Install LLVM (for shiboken6 libclang)
        if: matrix.platform == 'windows-x64'
        run: choco install --no-progress -y llvm
      - name: Install host cmake + ninja
        if: matrix.platform == 'windows-x64'
        shell: bash
        # --break-system-packages: defensive parity with build-macos.sh's
        # invocation; harmless on Windows runner Pythons that aren't PEP
        # 668 managed and the only correct option when the runner image
        # ever switches to a managed Python.
        run: python -m pip install --upgrade --quiet --break-system-packages 'cmake>=3.21' ninja
      - name: Build Qt6 + PySide6 (windows-x64)
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: ./MagPython/build-pyside6-windows.sh

      - if: startsWith(matrix.platform, 'windows-')
        run: 'cd MagPython && ren Release MagPython && 7z a -r ..\MagPython-${{ matrix.platform }}.zip MagPython'

      # Linux build (manylinux_2_28 container)
      - if: matrix.platform == 'linux-x86_64'
        run: ./MagPython/build-linux.sh

      # macOS build
      - if: matrix.platform == 'macos-arm64'
        run: ./MagPython/build-macos.sh

      # Per-platform release-notes fragment. Logic lives in the script so it
      # can be exercised locally (./MagPython/build-details.sh <platform>)
      # without standing up a workflow run.
      - name: Generate build details
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ matrix.container }}
          RUNNER_LABEL: ${{ matrix.runs-on }}
        run: bash MagPython/build-details.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: MagPython-${{ matrix.platform }}
          retention-days: 7
          path: |
            MagPython-${{ matrix.platform }}.zip
            MagPython-${{ matrix.platform }}.md
