name: Build All

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Mondays at 6 AM UTC
  workflow_dispatch:
  workflow_call:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86
            # Explicit label, not windows-latest: the build needs the
            # v142 toolset component (see README), which is only
            # guaranteed to be present on the explicitly-labelled
            # images. As of 2026-05-12 GitHub redirects this label to
            # the windows-2025-vs2026 image (VS 2026 replacing VS 2022);
            # v142 is preserved on that image via the
            # Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64
            # component. Don't bump past windows-2025 without confirming
            # v142 is still present on the new image.
            runs-on: windows-2025
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - platform: macos-arm64
            runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      # Cache the build-time-downloaded source trees so subsequent CI
      # runs skip the download + extract when the version+SHA pins
      # haven't changed. Cache miss only on a version bump (or on the
      # first run after a cache was added). One step per devendored
      # dep so a bump in one doesn't invalidate the others.
      # actions/cache@v4 scopes the cache key by OS implicitly, so
      # per-platform tarball extraction state stays isolated.
      - name: Cache OpenSSL download
        uses: actions/cache@v4
        with:
          path: MagPython/openssl
          key: deps-openssl-${{ matrix.platform }}-${{ hashFiles('MagPython/openssl-version', 'MagPython/openssl-sha256') }}
      - name: Cache libmpdec download
        uses: actions/cache@v4
        with:
          path: MagPython/libmpdec
          key: deps-libmpdec-${{ matrix.platform }}-${{ hashFiles('MagPython/libmpdec-version', 'MagPython/libmpdec-sha256') }}
      - name: Cache zlib download
        uses: actions/cache@v4
        with:
          path: MagPython/zlib
          key: deps-zlib-${{ matrix.platform }}-${{ hashFiles('MagPython/zlib-version', 'MagPython/zlib-sha256') }}
      - name: Cache libffi download
        uses: actions/cache@v4
        with:
          path: MagPython/libffi
          key: deps-libffi-${{ matrix.platform }}-${{ hashFiles('MagPython/libffi-version', 'MagPython/libffi-sha256') }}
      - name: Cache SQLite download
        uses: actions/cache@v4
        with:
          path: MagPython/sqlite
          key: deps-sqlite-${{ matrix.platform }}-${{ hashFiles('MagPython/sqlite-version', 'MagPython/sqlite-year', 'MagPython/sqlite-sha256') }}
      - name: Cache CPython download
        uses: actions/cache@v4
        with:
          path: MagPython/python
          key: deps-python-${{ matrix.platform }}-${{ hashFiles('MagPython/python-version', 'MagPython/python-sha256') }}

      # Windows build (existing logic, unchanged behaviour)
      - if: matrix.platform == 'windows-x86'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - if: matrix.platform == 'windows-x86'
        run: '& msbuild /m /p:Configuration=Release MagPython\MagPython.metaproj'
      - if: matrix.platform == 'windows-x86'
        run: 'cd MagPython && ren Release MagPython && 7z a -r ..\MagPython-windows-x86.zip MagPython'

      # Linux build (manylinux_2_28 container)
      - if: matrix.platform == 'linux-x86_64'
        run: ./MagPython/build-linux.sh

      # macOS build
      - if: matrix.platform == 'macos-arm64'
        run: ./MagPython/build-macos.sh

      # Per-platform release-notes fragment. Logic lives in the script so it
      # can be exercised locally (./MagPython/build-details.sh <platform>)
      # without standing up a workflow run.
      - name: Generate build details
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ matrix.container }}
          RUNNER_LABEL: ${{ matrix.runs-on }}
        run: bash MagPython/build-details.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: MagPython-${{ matrix.platform }}
          retention-days: 7
          path: |
            MagPython-${{ matrix.platform }}.zip
            MagPython-${{ matrix.platform }}.md
