name: Release

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Release name (also used as the git tag)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: "./.github/workflows/Build All.yml"

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Compose release notes
        run: |
          set -euo pipefail

          # Each per-platform build job emits its own MagPython-<platform>.md
          # alongside the zip (see "Generate build details" in Build All.yml).
          # Concatenating those is enough — the release workflow doesn't need
          # to know anything about Python / OpenSSL / toolchain versions.
          mapfile -t FRAGMENTS < <(find artifacts -name 'MagPython-*.md' -type f | sort)
          [ "${#FRAGMENTS[@]}" -gt 0 ] || { echo "no MagPython-*.md fragments found under artifacts/" >&2; exit 1; }

          {
            echo "## Build details"
            echo
            for f in "${FRAGMENTS[@]}"; do
              cat "$f"
              echo
            done
          } > body.md

          cat body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(find artifacts -name '*.zip' -type f | sort)
          [ "${#ASSETS[@]}" -gt 0 ] || { echo "no artifacts found under artifacts/" >&2; exit 1; }
          # --generate-notes appends GitHub's auto-generated changelog after
          # the body we wrote (the API pre-pends `body` to the generated notes).
          gh release create "$NAME" \
            --title "$NAME" \
            --target "$GITHUB_SHA" \
            --notes-file body.md \
            --generate-notes \
            "${ASSETS[@]}"
