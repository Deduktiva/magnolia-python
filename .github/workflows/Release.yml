name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: "./.github/workflows/Build All.yml"

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Name is v<python>-<run#>, e.g. v3.13.13-5. github.run_number
      # auto-increments per workflow, so each Release run gets a unique
      # tag without manual input. PY_VERSION reads from the in-tree pin
      # file (CPython is downloaded at build time — no Python/ tree on
      # a fresh checkout to read patchlevel.h from).
      - name: Derive release name
        id: name
        run: |
          PY_VERSION=$(tr -d '[:space:]' < MagPython/python-version)
          echo "name=v${PY_VERSION}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Logic lives in MagPython/release.sh so the notes-composition step
      # can be exercised locally with DRY_RUN=1, without standing up a
      # full release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash MagPython/release.sh "${{ steps.name.outputs.name }}"
